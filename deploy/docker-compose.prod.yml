# Production stack for a single VM (see docs/deploy-aws.md).
#
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Only Caddy publishes ports (80/443). Everything else talks over the private Docker network.
x-logging: &default-logging
  # Without a cap, container logs grow until the disk is full.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: cloudpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpilot -d cloudpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    logging: *default-logging

  backend:
    image: ghcr.io/sudhanshushekar898/cloudpilot-backend:${IMAGE_TAG:?set IMAGE_TAG to a released git sha}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MANAGEMENT_SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/cloudpilot
      DB_USERNAME: cloudpilot
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEMO_SEED_USERS: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 900m
    logging: *default-logging

  frontend:
    image: ghcr.io/sudhanshushekar898/cloudpilot-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    logging: *default-logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 203.0.113.10.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    mem_limit: 64m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudpilot-overview.json
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 192m
    logging: *default-logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
