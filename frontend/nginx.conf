server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA and the API share one origin, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a client-side route: serve index.html, never cache it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
    }
}
