name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile + unit tests + Testcontainers integration tests + JaCoCo 80% gate.
      # GitHub's Ubuntu runners have Docker, so Testcontainers works without extra setup.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ops:
    name: Monitoring config (Prometheus rules, Grafana dashboard, Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v2.54.1
          check config /etc/prometheus/prometheus.yml
      - name: Check the Grafana dashboard is valid JSON
        run: jq -e '.panels | length > 0' ops/grafana/dashboards/cloudpilot-overview.json
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cloudpilot-backend:ci backend
      - name: Build frontend image
        run: docker build -t cloudpilot-frontend:ci frontend
