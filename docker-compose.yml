# Runs the full CloudPilot stack locally:  docker compose up --build
# Web app: http://localhost:3000   API: http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: ${DB_USERNAME:-cloudpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudpilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cloudpilot
      DB_USERNAME: ${DB_USERNAME:-cloudpilot}
      DB_PASSWORD: ${DB_PASSWORD:-cloudpilot}
      # Dev-only default; set JWT_SECRET in .env for anything shared.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      DEMO_SEED_USERS: ${DEMO_SEED_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CloudPilot#2026}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:8081"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
