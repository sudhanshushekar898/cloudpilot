# Runs the full CloudPilot stack locally:  docker compose up --build
# Web app: http://localhost:3000   API: http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: ${DB_USERNAME:-cloudpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudpilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cloudpilot
      DB_USERNAME: ${DB_USERNAME:-cloudpilot}
      DB_PASSWORD: ${DB_PASSWORD:-cloudpilot}
      # Dev-only default; set JWT_SECRET in .env for anything shared.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      DEMO_SEED_USERS: ${DEMO_SEED_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CloudPilot#2026}
      # Optional. Without it, incident analysis uses the rule-based analyser.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Actuator (health, Prometheus) on 8081, which is NOT published below: only Prometheus
      # and Docker's health check, inside the network, can reach it.
      MANAGEMENT_SERVER_PORT: 8081
      # JSON logs (Elastic Common Schema), one object per line, including the request id.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:8081"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only access without logging in, for the local demo only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudpilot-overview.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  prometheus-data:
