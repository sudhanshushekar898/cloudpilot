spring:
  application:
    name: cloudpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudpilot}
    username: ${DB_USERNAME:cloudpilot}
    password: ${DB_PASSWORD:cloudpilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
