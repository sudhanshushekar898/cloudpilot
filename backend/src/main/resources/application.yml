spring:
  application:
    name: cloudpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudpilot}
    username: ${DB_USERNAME:cloudpilot}
    password: ${DB_PASSWORD:cloudpilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

cloudpilot:
  security:
    jwt:
      # Override with the JWT_SECRET environment variable everywhere except local dev.
      # The prod profile refuses to start with this default value.
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      ttl: 1h
      issuer: cloudpilot
  demo:
    seed-users: ${DEMO_SEED_USERS:true}
    password: ${DEMO_PASSWORD:CloudPilot#2026}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    interval: 10s
    backfill: 1h
  metrics:
    retention: 7d
  ai:
    # Empty = rule-based analysis only. Never commit a real key.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLOUDPILOT_AI_MODEL:claude-opus-5-5}
    effort: ${CLOUDPILOT_AI_EFFORT:high}
    server-fallbacks: ${CLOUDPILOT_AI_SERVER_FALLBACKS:true}
    timeout: 120s

server:
  port: 8080

management:
  # Actuator shares the application port by default. In Docker, MANAGEMENT_SERVER_PORT=8081 moves it
  # to a port that is not published, so only Prometheus inside the network can scrape it.
  # (Setting it here to ${server.port} would break tests: port 0 means "a separate random port".)
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: cloudpilot
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99 latency across instances.
      percentiles-histogram:
        http.server.requests: true
        cloudpilot.analysis.duration: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
